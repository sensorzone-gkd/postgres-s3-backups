services:
  - name: backup-db
    type: cron
    schedule: "0 3 * * *"
    region: ohio
    env: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sensorzone-database-production
          property: connectionString
      # The AWS region of the backup bucket
      - key: AWS_REGION
        sync: false 
      # A globally unique name for your bucket
      # For example, <your-username>-<database name>-render-postgres-backups
      - key: S3_BUCKET_NAME
        sync: false
      # IAM role assumed by this cron job through Render-managed OIDC
      - key: AWS_ROLE_ARN
        sync: false
      # Postgres version of your Postgres instance 
      # For example, 16
      - key: POSTGRES_VERSION
        sync: false
      # Alpine base-OS version, see README
      # For example, 3.20
      - key: ALPINE_VERSION
        sync: false

